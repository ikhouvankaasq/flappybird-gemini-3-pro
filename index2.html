<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Remastered</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@600&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            touch-action: none; 
            font-family: 'Teko', sans-serif;
        }
        canvas {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // --- GAME CONFIG ---
    let frames = 0;
    let score = 0;
    let highScore = localStorage.getItem('flappyHighScore') || 0;
    let state = 'START'; // START, PLAYING, GAMEOVER
    let gameSpeed = 3.5; // Slight speed increase for smoother feel
    
    // --- SCALING & RESIZE ---
    function resize() {
        // We force a maximum width for desktop so it doesn't look stretched
        // But on mobile it fills the screen
        if (window.innerWidth > 480) {
            canvas.width = 480;
            canvas.height = window.innerHeight;
            canvas.style.borderLeft = "2px solid #000";
            canvas.style.borderRight = "2px solid #000";
        } else {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.border = "none";
        }
        
        ground.y = canvas.height - 112; // High ground like original
        
        if(state === 'START') {
            bird.y = canvas.height / 2 - 50;
        }
    }
    window.addEventListener('resize', resize);

    // --- OBJECTS ---

    const bird = {
        x: 50,
        y: 150,
        width: 34,
        height: 24,
        velocity: 0,
        gravity: 0.25,
        jump: -4.6,
        rotation: 0,
        
        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y);
            // Rotation logic: tilt up when jumping, nosedive when falling
            let targetRotation = (this.velocity * 0.1);
            this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, targetRotation));
            ctx.rotate(this.rotation);

            // 1. Body (Yellow)
            ctx.fillStyle = "#f4bc2c"; // Classic yellow
            ctx.fillRect(-17, -12, 34, 24);
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#000";
            ctx.strokeRect(-17, -12, 34, 24);

            // 2. Eye (White with pupil)
            ctx.fillStyle = "#fff";
            ctx.fillRect(6, -18, 14, 14); // Big white eye
            ctx.strokeRect(6, -18, 14, 14);
            ctx.fillStyle = "#000";
            ctx.fillRect(14, -14, 4, 4); // Pupil

            // 3. Wing (White)
            ctx.fillStyle = "#fff";
            ctx.fillRect(-10, -2, 16, 10);
            ctx.strokeRect(-10, -2, 16, 10);

            // 4. Lips (Orange - Top and Bottom)
            ctx.fillStyle = "#e65612"; 
            ctx.fillRect(8, 2, 14, 8); // Lip box
            ctx.strokeRect(8, 2, 14, 8);
            // Lip split line
            ctx.beginPath();
            ctx.moveTo(8, 8);
            ctx.lineTo(22, 8);
            ctx.stroke();

            ctx.restore();
        },
        
        update: function() {
            this.velocity += this.gravity;
            this.y += this.velocity;

            // Floor collision
            if (this.y + 12 >= ground.y) { // +12 is half height roughly
                this.y = ground.y - 12;
                gameOver();
            }
            
            // Ceiling collision (optional, but good for anti-cheat)
            if (this.y < 0) {
                this.y = 0;
                this.velocity = 0;
            }
        },
        
        flap: function() {
            this.velocity = this.jump;
        }
    };

    const ground = {
        y: 0,
        height: 112,
        offsetX: 0,
        draw: function() {
            // Top border line
            ctx.fillStyle = "#ded895";
            ctx.fillRect(0, this.y, canvas.width, this.height);
            
            // Green grass trim
            ctx.fillStyle = "#73bf2e";
            ctx.fillRect(0, this.y, canvas.width, 14);
            ctx.strokeRect(0, this.y, canvas.width, 14);
            
            // Moving chevron pattern
            ctx.save();
            ctx.beginPath();
            ctx.strokeStyle = "#d0c983"; // Darker beige for pattern
            ctx.lineWidth = 4;
            
            // Draw diagonal lines
            let spacing = 20;
            for(let i = -spacing; i < canvas.width + spacing; i+= spacing) {
                let x = i - this.offsetX;
                // Simple diagonal slash
                ctx.moveTo(x, this.y + 14);
                ctx.lineTo(x - 10, this.height + this.y);
            }
            ctx.stroke();
            ctx.restore();
            
            // Top border again to clean up strokes
            ctx.beginPath();
            ctx.moveTo(0, this.y);
            ctx.lineTo(canvas.width, this.y);
            ctx.stroke();
        },
        update: function() {
            this.offsetX = (this.offsetX + gameSpeed) % 20;
        }
    };

    const background = {
        draw: function() {
            // Classic Flappy Blue
            ctx.fillStyle = "#70c5ce"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Distant City/Bushes layer (Static for simplicity, adds depth)
            ctx.fillStyle = "#a3e8cc"; // Light green bush color
            ctx.beginPath();
            // Draw a simple rolling hill shape at the bottom
            let baseline = ground.y;
            ctx.moveTo(0, baseline);
            for(let i=0; i<=canvas.width; i+=50) {
                ctx.lineTo(i, baseline - 20 - Math.sin(i * 0.05)*10);
            }
            ctx.lineTo(canvas.width, baseline);
            ctx.fill();
        }
    };

    const pipes = {
        items: [],
        width: 52,
        gap: 140, // Wider gap for better playability
        dx: gameSpeed,
        lastY: 0, // IMPORTANT: To track previous pipe position

        draw: function() {
            for (let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                let bottomY = p.y + this.gap;
                
                ctx.fillStyle = "#73bf2e"; // Light Green
                ctx.strokeStyle = "#000";  // Outline
                ctx.lineWidth = 2;

                // --- TOP PIPE ---
                ctx.fillRect(p.x, 0, this.width, p.y);
                ctx.strokeRect(p.x, -2, this.width, p.y + 2); // Body
                
                // Top Cap (The rim)
                ctx.fillRect(p.x - 2, p.y - 24, this.width + 4, 24);
                ctx.strokeRect(p.x - 2, p.y - 24, this.width + 4, 24);

                // --- BOTTOM PIPE ---
                ctx.fillRect(p.x, bottomY, this.width, ground.y - bottomY);
                ctx.strokeRect(p.x, bottomY, this.width, ground.y - bottomY);

                // Bottom Cap
                ctx.fillRect(p.x - 2, bottomY, this.width + 4, 24);
                ctx.strokeRect(p.x - 2, bottomY, this.width + 4, 24);
                
                // Highlights (The "Shiny" part)
                ctx.fillStyle = "#9ce659"; // Lighter green
                // Top Highlight
                ctx.fillRect(p.x + 4, 0, 4, p.y - 24); 
                // Bottom Highlight
                ctx.fillRect(p.x + 4, bottomY + 24, 4, ground.y - bottomY - 24);
            }
        },
        
        update: function() {
            // Spawn Rate depends on width
            let spawnDistance = 180; // Distance between pipes in pixels
            
            // If array is empty or last pipe has moved far enough
            if (this.items.length === 0 || canvas.width - this.items[this.items.length - 1].x >= spawnDistance) {
                
                // --- THE "POSSIBILITY" LOGIC ---
                let minPipe = 50;
                let maxPipe = ground.y - minPipe - this.gap;
                
                let y;
                if (this.items.length === 0) {
                    // First pipe: centered
                    y = maxPipe / 2 + 20;
                } else {
                    // Subsequent pipes: Clamp to previous position
                    // Limit the change to ±180px so the bird can reach it
                    let maxJump = 180; 
                    let minReachable = this.lastY - maxJump;
                    let maxReachable = this.lastY + maxJump;
                    
                    // Clamp generated values within screen AND reachable bounds
                    let safeMin = Math.max(minPipe, minReachable);
                    let safeMax = Math.min(maxPipe, maxReachable);
                    
                    y = Math.floor(Math.random() * (safeMax - safeMin + 1) + safeMin);
                }
                
                this.lastY = y; // Remember this for next time

                this.items.push({
                    x: canvas.width,
                    y: y,
                    passed: false
                });
            }

            for (let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                p.x -= this.dx;

                // Collision Logic (AABB)
                // Use a smaller hitbox for the bird (forgiveness)
                let bLeft = bird.x - 12;
                let bRight = bird.x + 12;
                let bTop = bird.y - 8;
                let bBottom = bird.y + 8;

                // Pipe X Check
                if (bRight > p.x && bLeft < p.x + this.width) {
                    // Pipe Y Check
                    if (bTop < p.y || bBottom > p.y + this.gap) {
                        gameOver();
                    }
                }

                // Score
                if (p.x + this.width < bird.x && !p.passed) {
                    score++;
                    p.passed = true;
                }

                // Remove
                if (p.x + this.width < -10) {
                    this.items.shift();
                    i--;
                }
            }
        },
        reset: function() {
            this.items = [];
        }
    };

    // --- GAME LOOP ---

    function drawScore() {
        ctx.fillStyle = "white";
        ctx.strokeStyle = "black";
        ctx.lineWidth = 3;
        ctx.textAlign = "center";
        
        if (state === 'PLAYING') {
            ctx.font = "bold 60px Teko";
            ctx.strokeText(score, canvas.width/2, 80);
            ctx.fillText(score, canvas.width/2, 80);
        } else if (state === 'GAMEOVER') {
            // Draw Score Board Box
            let boxW = 200;
            let boxH = 120;
            let boxX = canvas.width/2 - boxW/2;
            let boxY = canvas.height/2 - 60;
            
            ctx.fillStyle = "#ded895";
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.lineWidth = 3;
            ctx.strokeRect(boxX, boxY, boxW, boxH);
            
            // Labels
            ctx.fillStyle = "#e65612"; // Orange Text
            ctx.font = "bold 25px Teko";
            ctx.fillText("SCORE", boxX + boxW/2, boxY + 30);
            ctx.fillStyle = "white";
            ctx.strokeText(score, boxX + boxW/2, boxY + 55);
            ctx.fillText(score, boxX + boxW/2, boxY + 55);
            
            ctx.fillStyle = "#e65612";
            ctx.fillText("BEST", boxX + boxW/2, boxY + 85);
            ctx.fillStyle = "white";
            ctx.strokeText(highScore, boxX + boxW/2, boxY + 110);
            ctx.fillText(highScore, boxX + boxW/2, boxY + 110);
            
            ctx.font = "bold 40px Teko";
            ctx.strokeText("GAME OVER", canvas.width/2, boxY - 30);
            ctx.fillText("GAME OVER", canvas.width/2, boxY - 30);
            
            ctx.font = "20px Teko";
            ctx.fillStyle = "white";
            ctx.strokeText("TAP TO RESTART", canvas.width/2, boxY + boxH + 40);
            ctx.fillText("TAP TO RESTART", canvas.width/2, boxY + boxH + 40);
        } else if (state === 'START') {
            ctx.font = "bold 50px Teko";
            ctx.strokeText("FLAPPY BIRD", canvas.width/2, canvas.height/2 - 60);
            ctx.fillText("FLAPPY BIRD", canvas.width/2, canvas.height/2 - 60);
            
            ctx.font = "25px Teko";
            ctx.strokeText("TAP TO START", canvas.width/2, canvas.height/2 + 20);
            ctx.fillText("TAP TO START", canvas.width/2, canvas.height/2 + 20);
        }
    }

    function gameOver() {
        state = 'GAMEOVER';
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('flappyHighScore', highScore);
        }
    }

    function reset() {
        bird.y = canvas.height/2;
        bird.velocity = 0;
        bird.rotation = 0;
        score = 0;
        pipes.reset();
        frames = 0;
        state = 'START';
    }

    function loop() {
        // Clear & Draw BG
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        background.draw();
        
        if (state === 'PLAYING') {
            pipes.update();
            bird.update();
            ground.update();
            pipes.draw();
        } else if (state === 'START') {
            ground.update();
            bird.y = (canvas.height/2 - 50) + Math.sin(Date.now() / 200) * 10;
        } else if (state === 'GAMEOVER') {
            pipes.draw(); // Draw static pipes
        }

        ground.draw(); // Ground always on top of pipes
        bird.draw();   // Bird always on top of ground
        drawScore();

        requestAnimationFrame(loop);
    }

    // --- CONTROLS ---
    function action(e) {
        if (e.type === 'keydown' && e.code !== 'Space') return;
        if (e.type === 'keydown') e.preventDefault();

        if (state === 'START') {
            state = 'PLAYING';
            bird.flap();
        } else if (state === 'PLAYING') {
            bird.flap();
        } else if (state === 'GAMEOVER') {
            reset();
        }
    }

    window.addEventListener('keydown', action);
    window.addEventListener('touchstart', action);
    window.addEventListener('mousedown', action);

    // Init
    resize();
    reset();
    loop();

</script>
</body>
</html>
